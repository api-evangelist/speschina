aid: speschina
name: SPES (speschina)
description: >-
  SPES (诗裴丝) is a China-based consumer personal-care and beauty brand operating a
  direct-to-consumer business across Chinese e-commerce and social-commerce channels,
  including its Tmall flagship store, a JD.com storefront, and Douyin, Xiaohongshu (RED),
  and Weibo social accounts, with a WeChat official account. The brand runs a marketing
  website (a Vue.js / Element UI single-page app served from Alibaba Cloud) and was surfaced
  as a portfolio company of Qiming Venture Partners. It does not currently publish any public
  developer API, OpenAPI specification, SDK, developer portal, or API documentation; the only
  HTTP API referenced by its site is a private content backend for the marketing pages. This
  profile records the enrichment pass that confirmed there is no public API surface to catalog.
